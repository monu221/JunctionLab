# JunctionLab defaults. See docs/method.md and docs/plan.md (Decisions).
# The app form edits scenarios, never this file.
# Values that are still undecided are not listed yet; each milestone adds the ones it needs.

geometry:
  approach_length_m: 300        # every lane runs the full length; exit legs mirror the inbound lane count
  queue_warning_share: 0.8      # warn when an approach's max queue reaches this share of its length
  speed_limit_kmh: 50           # German urban default

simulation:
  seeds: [1, 2, 3, 4, 5]
  warmup_s: 600
  measurement_s: 3600           # vehicles departing in this window are measured
  runout_max_s: 900             # extra time so measured vehicles can leave; hard time cap after this
  time_to_teleport_s: -1        # teleports disabled
  step_length_s: 1.0            # SUMO default; report Webster issues before changing it
  gridlock_stop_s: 300          # warn when any vehicle has been stopped longer than this

driver:
  car_follow_model: Krauss
  sigma: 0.5                    # SUMO default

vehicles:
  car_vclass: passenger         # SUMO default types, unchanged
  heavy_vclass: truck
  bus_vclass: bus
  bus_demand_default_bph: 0

scenario_defaults:
  # Lane use per approach, listed from the leftmost lane to the rightmost.
  lanes: [[left, through], [through, right]]
  heavy_vehicle_share_pct: 5
  # Turning shares in % when the text gives none.
  turning_shares_pct:
    four_arm: {left: 15, through: 70, right: 15}
    t_major: {through: 80, into_stem: 20}   # major-road approaches of a T-junction
    t_stem: {left: 50, right: 50}

control:
  major_road_default: north-south   # T-junction: the stem is always minor
  four_arm_phase_plan_default: two_phase   # alternative: four_phase_split
  amber_s: 3
  all_red_s: 2
  cycle_default_s: 90
  min_green_s: 5
  # Measured in M4 with `python -m junctionlab webster` (2026-11-18; SUMO 1.28, Krauss
  # sigma 0.5, step 1 s, 50 km/h, cars only). Replaced the 1800 veh/h placeholder.
  saturation_flow_vphpl: 1861
  # Lost time per phase from the same run: effective green = green + amber - lost time.
  lost_time_s: 5.75

los:
  # HCM average delay thresholds (s/veh): upper bounds for A..E; above the last one is F.
  signalised: {A: 10, B: 20, C: 35, D: 55, E: 80}
  unsignalised: {A: 10, B: 15, C: 25, D: 35, E: 50}
  # Unsignalised approaches: grade F when throughput < this share of demand.
  overload_throughput_share: 0.95
  # Unsignalised approaches: grade F when the insertion backlog grows by at least this many
  # vehicles from the start to the end of the measurement period.
  backlog_growth_min_veh: 5

baseline:
  # Free-flow baseline (subtracted to get control delay): cars only, unregulated junction,
  # this demand per approach and movement, for this long.
  demand_vph_per_movement: 60
  duration_s: 1800

webster:
  # Test signal: 90 s cycle, 40 s green on the test approach = two-phase with equal greens.
  cycle_s: 90
  green_s: 40
  x_tested: [0.5, 0.7, 0.85]
  x_info_only: [0.95]
  margin_relative: 0.15         # pass if within +-15% or +-3 s, whichever is larger
  margin_absolute_s: 3.0

llm:
  model: claude-haiku-5-5
  calls_per_session: 5
  calls_per_day: 50
  counter_file: var/llm_calls.json   # daily count (UTC date); relative to the repo root
  max_tokens: 16000
  effort: medium                     # Haiku 5.5 default; low | medium | high
  max_input_chars: 2000              # longer descriptions are rejected before any call
